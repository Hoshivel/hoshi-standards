# 主分支的驗證。
#
# 本倉庫只有 Markdown，沒有建置步驟——所以這裡驗的是**連結指不指得到東西**。
# 一條指向不存在檔案的相對連結，在 GitHub 上會安靜地 404，而 diff 上看不出來。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  links:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: 內部連結
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: 相對連結必須指得到檔案
        run: python3 tools/check-links.py

  # **本倉庫是公開的，所以掃描與 `links` 同時起跑**，不等它綠燈。
  #
  # 公開倉庫的 Actions 分鐘數不計費，所以「基礎驗證紅燈時整組 skipped、
  # 省下執行器時間」在這裡換不到任何東西，只換到更晚才知道掃描的結論。
  # 本倉庫的代價比其餘四個公開倉庫更小：這裡沒有 CodeQL 也沒有 govulncheck
  # （沒有程式碼可以建），而 Gitleaks 與 Trivy 本來就不建置任何東西——
  # 連結壞掉不會讓它們吐出第二顆與根因無關的紅燈。
  #
  # **私有倉庫維持 `needs:` 那道閘**——那裡的分鐘數要付錢。兩種形狀是刻意的，
  # 不是漂移；判準與理由見 workspace `AGENTS.md` §1.9.1。
  #
  # 掃描本身的定義在 `security.yml`，那支同時還掛著每週排程。
  security:
    # 草稿 PR 不跑。**這一行不能省**：沒有 `needs:` 之後，草稿的 skip 不再從
    # 基礎驗證那邊傳遞過來，少了它草稿 PR 會開始跑掃描。
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: 安全掃描
    uses: ./.github/workflows/security.yml
    permissions:
      contents: read
      # 呼叫端的權限是被呼叫 job 的**上限**，所以這裡要給到聯集。
      # CodeQL 與 Trivy 上傳 SARIF 要 security-events: write。
      security-events: write
    # 本倉庫的掃描不需要任何 secret，但呼叫端不宣告的話被呼叫端一個都拿不到，
    # 而形狀要與其餘十二個倉庫一致。
    secrets: inherit
